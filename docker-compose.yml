services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uddan_app
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    depends_on:
      - mysql
    networks:
      - uddan_network

  mysql:
    image: mysql:8.0
    container_name: uddan_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-uddan_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - uddan_network

volumes:
  db_data:
    driver: local
  storage_uploads:
    driver: local

networks:
  uddan_network:
    driver: bridge
